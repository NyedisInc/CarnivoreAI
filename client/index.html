    <div id="deep-link-error" role="status" aria-live="polite">
        <span id="deep-link-error-text" class="deep-link-error__text"></span>
        <button type="button" id="deep-link-error-dismiss"
                class="deep-link-error__dismiss" aria-label="dismiss notice">&times;</button>
    </div>

    <div class="header">
        <div class="header-row">
        <div class="header-home-spacer" aria-hidden="true"></div>
        <button type="button" id="session-sidebar-toggle" class="session-sidebar-toggle hidden"
                data-auth-only
                aria-expanded="false" aria-controls="session-sidebar-panel"
                aria-label="Agents" title="agents">
            <img src="/static/img/carnivore/carnivore-mark.png"
                 srcset="/static/img/carnivore/carnivore-mark@2x.png 2x"
                 class="session-sidebar-toggle-mark" alt="" aria-hidden="true" />
            <span id="headerAlertDot"></span>
        </button>
        <h1 id="appTitle">
            <button type="button" id="header-icon" class="header-icon header-icon--wordmark"
                    aria-label="Carnivore, go to the home screen"><img data-brand-icon src="/static/img/carnivore/carnivore-wordmark.png" srcset="/static/img/carnivore/carnivore-wordmark@2x.png 2x" alt="" /></button>
            <span id="header-title-text"></span>
            <!-- that does nothing -->
            <button type="button" id="launchpad-help-btn" class="btn-icon" aria-label="help">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <circle cx="12" cy="12" r="10"/>
                    <path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 2.5-3 4"/>
                    <line x1="12" y1="17.5" x2="12" y2="17.5"/>
                </svg>
            </button>
        </h1>
        <div class="controls">
            <button id="logoutBtn" class="hidden" aria-label="Logout">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                    <path d="M7 2.5H3.75C3.05964 2.5 2.5 3.05964 2.5 3.75V12.25C2.5 12.9404 3.05964 13.5 3.75 13.5H7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M6.25 8H13.25" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                    <path d="M10.5 5.25L13.25 8L10.5 10.75" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </button>
            <button type="button" id="settingsBtn" class="hidden" aria-label="Settings">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                    <circle cx="8" cy="8" r="4.2" stroke="currentColor" stroke-width="1.5"/>
                    <circle cx="8" cy="8" r="1.6" stroke="currentColor" stroke-width="1.5"/>
                    <path d="M8 3.8V2.2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                    <path d="M11.64 5.9L13.02 5.1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                    <path d="M11.64 10.1L13.02 10.9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                    <path d="M8 12.2V13.8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                    <path d="M4.36 10.1L2.98 10.9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                    <path d="M4.36 5.9L2.98 5.1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                </svg>
            </button>
            <button type="button" id="configEditorBtn" class="btn-icon hidden" aria-label="File editor" title="file editor" aria-expanded="false" aria-controls="config-editor-panel">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                    <path d="M2 5.25C2 4.69772 2.44772 4.25 3 4.25H6.5L7.75 5.75H13C13.5523 5.75 14 6.19772 14 6.75V11.25C14 11.8023 13.5523 12.25 13 12.25H3C2.44772 12.25 2 11.8023 2 11.25V5.25Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
                </svg>
            </button>
            <button type="button" id="sessionNotesBtn" class="btn-icon hidden" aria-label="notes" title="notes for this session" aria-pressed="false">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                    <path d="M3.25 2.5H9.25L12.75 6V13.5H3.25V2.5Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
                    <path d="M9.25 2.5V6H12.75" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
                    <path d="M5.75 9H10.25M5.75 11.25H8.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                </svg>
            </button>
            <button type="button" id="terminalSearchBtn" class="btn-icon"
                    aria-label="search session" title="search (Cmd+F)">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                    <circle cx="7" cy="7" r="4.5" stroke="currentColor" stroke-width="1.5"/>
                    <path d="m10.5 10.5 3.5 3.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                </svg>
            </button>
