schema = 2
api_version = 1
id = "devwidgetlab"
name = "widget lab"
description = "a developer page that draws any registered widget in each host it is declared for, at its published sizes, under any theme, from a fixture or a pasted json scenario, and captures it to a png with metadata. off by default; nothing runs until the page is open."
name_key = "cplug.devwidgetlab.name"
description_key = "cplug.devwidgetlab.description"
version = "0.1.0"
kind = "plugin"
icon = "grid"
author = "Carnivore"
license = "MIT"
min_app_version = "1.16.1"
tier = "dev"
default_enabled = false
css_prefix = "dwl"
tool_family = "widget_lab"

[permissions]
read = ["sessions.read"]
write = ["sessions.message", "sessions.create", "agent_writes"]

[permissions.reasons]
"sessions.read" = "list the sessions so a draft handed to Claude can name its session"
"sessions.message" = "a plugin may start a session only inside the owner's own request"
"sessions.create" = "start the Claude session that works inside a draft folder when the owner presses hand to claude"
agent_writes = "let agents create and edit widget lab drafts through the widget lab tools"

[ui]
routes = true
tabs = ["devwidgetlab"]
page_section = "dev"
page_section_label_key = "cplug.devwidgetlab.page_section"
page_section_icon = "grid"
popout = true
dev_frame_prefixes = ["/draft-harness/"]

[mcp]
tools = [
  "widget_lab_drafts_list",
  "widget_lab_draft_get",
  "widget_lab_draft_create",
  "widget_lab_draft_files_list",
  "widget_lab_draft_file_get",
  "widget_lab_draft_file_set",
  "widget_lab_draft_file_delete",
  "widget_lab_draft_rebuild",
  "widget_lab_draft_spawn",
  "widget_lab_draft_delete",
]

[owns]
strings = ["cplug.devwidgetlab."]
styles = ["lab.css", "lab-frame.css", "lab-menu.css", "lab-viewer.css"]
tests = ["tests/python/cplugs/devwidgetlab/", "web/src/cplugs/devwidgetlab/"]
style_guide = [
  "web/src/cplugs/devwidgetlab/CaptureFooter.svelte",
  "web/src/cplugs/devwidgetlab/CaptureResults.svelte",
  "web/src/cplugs/devwidgetlab/ChecksSection.svelte",
  "web/src/cplugs/devwidgetlab/ComparePair.svelte",
  "web/src/cplugs/devwidgetlab/DockBar.svelte",
  "web/src/cplugs/devwidgetlab/DraftActions.svelte",
  "web/src/cplugs/devwidgetlab/DraftCompare.svelte",
  "web/src/cplugs/devwidgetlab/DraftForm.svelte",
  "web/src/cplugs/devwidgetlab/DraftPanel.svelte",
  "web/src/cplugs/devwidgetlab/DrawerChrome.svelte",
  "web/src/cplugs/devwidgetlab/FindRow.svelte",
  "web/src/cplugs/devwidgetlab/FitTable.svelte",
  "web/src/cplugs/devwidgetlab/HostBand.svelte",
  "web/src/cplugs/devwidgetlab/HostChrome.svelte",
  "web/src/cplugs/devwidgetlab/IdleReadout.svelte",
  "web/src/cplugs/devwidgetlab/LabControls.svelte",
  "web/src/cplugs/devwidgetlab/LabFrame.svelte",
  "web/src/cplugs/devwidgetlab/LabMenu.svelte",
  "web/src/cplugs/devwidgetlab/LabViewer.svelte",
  "web/src/cplugs/devwidgetlab/MenuSection.svelte",
  "web/src/cplugs/devwidgetlab/PreviewFrame.svelte",
  "web/src/cplugs/devwidgetlab/ResizeBox.svelte",
  "web/src/cplugs/devwidgetlab/ScenarioBox.svelte",
  "web/src/cplugs/devwidgetlab/PointerMenu.svelte",
  "web/src/cplugs/devwidgetlab/SidebarControls.svelte",
  "web/src/cplugs/devwidgetlab/WidgetTree.svelte",
  "web/src/cplugs/devwidgetlab/WidgetTreeMenu.svelte",
  "web/src/cplugs/devwidgetlab/lab.css",
  "web/src/cplugs/devwidgetlab/lab-frame.css",
  "web/src/cplugs/devwidgetlab/lab-menu.css",
  "web/src/cplugs/devwidgetlab/lab-viewer.css",
]

[settings_schema]
version = 1

[settings_schema.fields.sourceFolder]
kind = "string"
labelKey = "cplug.devwidgetlab.settings.source_folder"
hintKey = "cplug.devwidgetlab.settings.source_folder_help"
maxLength = 1000
default = ""

[[data]]
id = "captures"
kind = "folder"
path = "captures"
scope_by = "install"

[data.policy]
own = "excluded"
share = "excluded"
reason = "developer screenshots and metadata a capture run writes; running the capture again rebuilds them"

[[data]]
id = "drafts"
kind = "folder"
path = "drafts"
scope_by = "install"

[data.policy]
own = "excluded"
share = "excluded"
reason = "widget drafts are work in progress on this machine; a shipped widget lives in the code, not here"
