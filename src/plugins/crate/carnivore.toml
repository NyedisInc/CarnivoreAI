schema = 2
api_version = 1
id = "crate"
name = "crates"
description = "export a session or a project to one crate file you can verify for years and read back without carnivore. byte exact, optionally encrypted with age, copied to a second folder if you set one. a separate share copy is redacted and resumes only as a fork. off by default."
name_key = "cplug.crate.name"
description_key = "cplug.crate.description"
version = "1.0.0"
kind = "plugin"
icon = "archive"
author = "Carnivore"
license = "MIT"
min_app_version = "1.16.1"
tier = "builtin"
default_enabled = false
css_prefix = "crt"

[permissions]
read = ["sessions.read"]
write = ["agent_writes", "imports.write"]

[permissions.reasons]
"sessions.read" = "check that every session in an export is asleep, and name sessions in the plan"
"agent_writes" = "let an agent cancel a crate job, verify a crate, copy one to your second folder, or unpack a plain crate into the feature's scratch folder; exporting always waits for you"
"imports.write" = "restore a crate into this install: write its sessions (asleep), project, transcripts and rows, only after you press restore with the plan's fingerprint"

[ui]
routes = true
plugins = ["settings-panel"]
topics = ["jobs"]

[mcp]
tools = [
  "crate_status",
  "crate_backup_families",
  "crate_export_preview",
  "crate_export",
  "crate_jobs_list",
  "crate_job_cancel",
  "crate_bundles_list",
  "crate_check",
  "crate_unpack",
  "crate_copy",
  "crate_remove",
  "crate_folder_crates_list",
  "crate_import_preview",
  "crate_import",
  "crate_imports_list",
  "crate_import_undo",
]

[owns]
routes = [
  "/summary",
  "/backup-families",
  "/plan",
  "/exports",
  "/jobs",
  "/jobs/{job_id}",
  "/jobs/{job_id}/cancel",
  "/bundles",
  "/bundles/{bundle_id}",
  "/bundles/{bundle_id}/contents",
  "/bundles/{bundle_id}/verify",
  "/bundles/{bundle_id}/copies",
  "/bundles/{bundle_id}/extract",
  "/bundles/{bundle_id}/download",
  "/folders/{folder}/crates",
  "/folders/primary/crates/upload",
  "/crates/remove",
  "/folders/{folder}/crates/{name}/contents",
  "/folders/{folder}/crates/{name}/verify",
  "/folders/{folder}/crates/{name}/extract",
  "/folders/{folder}/crates/{name}/download",
  "/imports/plan",
  "/imports",
  "/imports/{import_id}",
  "/imports/{import_id}/undo",
]
strings = ["cplug.crate."]
tests = ["tests/python/cplugs/crate/", "web/src/cplugs/crate/"]
style_guide = [
  "web/src/cplugs/crate/CratePanel.svelte",
  "web/src/cplugs/crate/ExportDialog.svelte",
  "web/src/cplugs/crate/ImportDialog.svelte",
  "web/src/cplugs/crate/RemoveDialog.svelte",
  "web/src/cplugs/crate/UndoDialog.svelte",
  "web/src/cplugs/crate/RestoredList.svelte",
  "web/src/cplugs/crate/ImportPreview.svelte",
  "web/src/cplugs/crate/ImportResult.svelte",
  "web/src/cplugs/crate/JobProgress.svelte",
  "web/src/cplugs/crate/TtyBox.svelte",
  "web/src/cplugs/crate/ProjectCrates.svelte",
  "web/src/cplugs/crate/crate-dialog.css",
]
contributions = ["settings.panel", "projects.panel"]

[settings_schema]
version = 1

[settings_schema.fields.folder]
kind = "string"
labelKey = "cplug.crate.settings.folder"
hintKey = "cplug.crate.settings.folder_hint"
maxLength = 1024
default = ""

[settings_schema.fields.secondFolder]
kind = "string"
labelKey = "cplug.crate.settings.second_folder"
hintKey = "cplug.crate.settings.second_folder_hint"
maxLength = 1024
default = ""

[settings_schema.fields.recipients]
kind = "string"
labelKey = "cplug.crate.settings.recipients"
hintKey = "cplug.crate.settings.recipients_hint"
maxLength = 2000
default = ""

[settings_schema.fields.encryptByDefault]
kind = "boolean"
labelKey = "cplug.crate.settings.encrypt_default"
default = false

[settings_schema.fields.keyHint]
kind = "string"
labelKey = "cplug.crate.settings.key_hint"
hintKey = "cplug.crate.settings.key_hint_hint"
maxLength = 200
default = ""

[[data]]
id = "jobs"
kind = "folder"
path = "jobs"
scope_by = "install"

[data.policy]
own = "excluded"
share = "excluded"
reason = "export, verify and copy job records, pruned after 30 days; the durable record of an export is its export_bundles row in carnivore.db"

[[data]]
id = "extract"
kind = "folder"
path = "extract"
scope_by = "install"

[data.policy]
own = "excluded"
share = "excluded"
reason = "conversations extracted from a crate for a resume check, swept after 24 hours"

[[data]]
id = "bundles"
kind = "folder"
root_setting = "folder"
default = "crates"
role = "backup_destination"
scope_by = "install"

[data.policy]
own = "excluded"
share = "excluded"
purge = "kept"
reason = "the crate files this plugin writes into the folder the owner picked; a crate never carries crates; a purge keeps the files, they are the owner's exports"

[[data]]
id = "second_copies"
kind = "folder"
root_setting = "secondFolder"
role = "backup_destination"
scope_by = "install"

[data.policy]
own = "excluded"
share = "excluded"
purge = "kept"
reason = "copies of crates in the owner's second folder; a crate never carries crates; a purge keeps them, they are the owner's off-box copies"

[[data]]
id = "imports"
kind = "folder"
path = "imports"
scope_by = "install"

[data.policy]
own = "excluded"
share = "excluded"
reason = "import receipts and the undo logs of imports in flight; this install's own record of what it restored, never part of a crate"
