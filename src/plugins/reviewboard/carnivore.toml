schema = 2
api_version = 1
id = "reviewboard"
name = "review board"
description = "a mockup under review as a folder of files in a git checkout: claude posts revisions, you tick, check and write notes on them, and a send goes to the task as your reply. needs the task manager and a boards folder. off by default: with it off there are no board routes and no board tools."
name_key = "cplug.reviewboard.name"
description_key = "cplug.reviewboard.description"
version = "0.7.0"
kind = "plugin"
icon = "plug"
author = "Carnivore"
license = "MIT"
min_app_version = "1.16.1"
tier = "builtin"
default_enabled = false
css_prefix = "rb"
tool_family = "task_manager"
requires = ["taskmanager"]

[legacy_ids]
publicboard = "publicLinksEnabled"

[mcp_tool_aliases]
publicboard_links_remove = "task_manager_board_public_links_remove"

[permissions]
write = ["agent_writes", "notify"]

[ui]
routes = true
storage = true
topics = ["boards", "drafts", "visitors"]
tabs = ["reviewboard"]
page_section = "review"
page_section_label_key = "cplug.reviewboard.page_section"
page_section_icon = "eye"
popout = true

[mcp]
tools = [
  "task_manager_boards_list",
  "task_manager_board_get",
  "task_manager_board_create",
  "task_manager_board_revision_add",
  "task_manager_board_focus",
  "task_manager_scratch_post",
  "task_manager_scratch_clear",
  "task_manager_board_attachment_add",
  "task_manager_board_attachment_remove",
  "task_manager_board_live_set",
  "task_manager_board_milestone_add",
  "task_manager_board_live_stop",
  "task_manager_board_public_links_remove",
]

[owns]
routes = [
  "/boards",
  "/boards/live",
  "/boards/{slug}",
  "/boards/{slug}/attachments",
  "/boards/{slug}/attachments/{file_id}",
  "/boards/{slug}/draft",
  "/boards/{slug}/live",
  "/boards/{slug}/live/end",
  "/boards/{slug}/live/milestone",
  "/boards/{slug}/live/send",
  "/boards/{slug}/look",
  "/boards/{slug}/open",
  "/boards/{slug}/payload-draft",
  "/boards/{slug}/revisions",
  "/boards/{slug}/revisions/{revision}/ticket",
  "/boards/{slug}/rounds",
  "/boards/{slug}/rounds/{round_id}/resend",
  "/boards/{slug}/saves",
  "/boards/{slug}/task",
  "/posted/open",
  "/rescan",
  "/root",
  "/scratch",
  "/view/{ticket_text}",
  "/public/status",
  "/public/links",
  "/public/links/{link_id}",
  "/public/links/{link_id}/token",
  "/public/visitors",
  "/public/visitors/forward",
  "/public/visitors/u/{number}",
  "/public/visitors/{response_id}",
]
strings = ["cplug.reviewboard."]
styles = [
  "board.css",
  "header.css",
  "tray.css",
  "public/share-link.css",
  "public/visitors.css",
  "public/visitor-page/public.css",
]
tests = ["tests/python/cplugs/reviewboard/", "web/src/cplugs/reviewboard/"]
style_guide = [
  "web/src/cplugs/reviewboard/AttachmentsKey.svelte",
  "web/src/cplugs/reviewboard/BoardFrame.svelte",
  "web/src/cplugs/reviewboard/BoardPicker.svelte",
  "web/src/cplugs/reviewboard/BoardScreen.svelte",
  "web/src/cplugs/reviewboard/ClosedReviews.svelte",
  "web/src/cplugs/reviewboard/HistoryBar.svelte",
  "web/src/cplugs/reviewboard/InlineLayer.svelte",
  "web/src/cplugs/reviewboard/LiveBar.svelte",
  "web/src/cplugs/reviewboard/NotesPanel.svelte",
  "web/src/cplugs/reviewboard/PayloadControls.svelte",
  "web/src/cplugs/reviewboard/PayloadNotices.svelte",
  "web/src/cplugs/reviewboard/PromptRow.svelte",
  "web/src/cplugs/reviewboard/RelinkPicker.svelte",
  "web/src/cplugs/reviewboard/RoundView.svelte",
  "web/src/cplugs/reviewboard/ThemePicker.svelte",
  "web/src/cplugs/reviewboard/Tray.svelte",
  "web/src/cplugs/reviewboard/VisitorAnswers.svelte",
  "web/src/cplugs/reviewboard/VisitorToggle.svelte",
  "web/src/cplugs/reviewboard/board.css",
  "web/src/cplugs/reviewboard/header.css",
  "web/src/cplugs/reviewboard/tray.css",
  "web/src/cplugs/reviewboard/public/ShareLinkKey.svelte",
  "web/src/cplugs/reviewboard/public/ShareLinkModal.svelte",
  "web/src/cplugs/reviewboard/public/VisitorsKey.svelte",
  "web/src/cplugs/reviewboard/public/VisitorsModal.svelte",
  "web/src/cplugs/reviewboard/public/visitor-page/PublicBoard.svelte",
  "web/src/cplugs/reviewboard/public/visitor-page/VisitorForm.svelte",
  "web/src/cplugs/reviewboard/public/visitor-page/VisitorKeys.svelte",
  "web/src/cplugs/reviewboard/public/visitor-page/VisitorRevisions.svelte",
  "web/src/cplugs/reviewboard/public/visitor-page/public.css",
  "web/src/cplugs/reviewboard/public/share-link.css",
  "web/src/cplugs/reviewboard/public/visitors.css",
]
contributions = ["projects.panel", "board.header_key", "page.row_action"]

[settings_schema]
version = 2

[settings_schema.fields.boardsRoot]
kind = "string"
labelKey = "cplug.reviewboard.settings.boards_root"
hintKey = "cplug.reviewboard.settings.boards_root_help"
maxLength = 1000
default = ""

[settings_schema.fields.publicLinksEnabled]
kind = "boolean"
labelKey = "cplug.reviewboard.public.settings.enabled"
hintKey = "cplug.reviewboard.public.settings.enabled_help"
default = false

[settings_schema.fields.port]
kind = "number"
labelKey = "cplug.reviewboard.public.settings.port"
hintKey = "cplug.reviewboard.public.settings.port_help"
min = 1024
max = 65535
default = 8190

[settings_schema.fields.bindAddress]
kind = "string"
labelKey = "cplug.reviewboard.public.settings.bind_address"
hintKey = "cplug.reviewboard.public.settings.bind_address_help"
maxLength = 64
default = "127.0.0.1"

[settings_schema.fields.hostnames]
kind = "string"
labelKey = "cplug.reviewboard.public.settings.hostnames"
hintKey = "cplug.reviewboard.public.settings.hostnames_help"
maxLength = 1000
default = ""

[settings_schema.fields.trustedProxies]
kind = "string"
labelKey = "cplug.reviewboard.public.settings.trusted_proxies"
hintKey = "cplug.reviewboard.public.settings.trusted_proxies_help"
maxLength = 1000
default = ""

[[data]]
id = "boards"
kind = "folder"
root_setting = "boardsRoot"
default = "review-boards"
scope_by = "task_item_id"

[data.policy]
own = "carried"
share = "excluded"
reason = "the review boards of a Task Manager item are the owner's own work and travel with the item; a share does not carry them; a purge keeps the folder and every board in it; the save plugin backs it up into its vault (policy.backup vault), .git history included"
purge = "kept"
backup = "vault"

[[data]]
id = "drafts"
kind = "folder"
path = "drafts"
scope_by = "install"

[data.policy]
own = "carried"
share = "excluded"
reason = "the owner's half-typed ticks and notes for the next round of a board; small, and a share does not carry them; the save plugin backs it up into its vault (policy.backup vault), .git history included"
backup = "vault"

[[data]]
id = "locks"
kind = "folder"
path = "locks"
scope_by = "install"

[data.policy]
own = "excluded"
share = "excluded"
reason = "per-board write lock files; held for seconds and meaningless on another machine, so not a store anyone keeps"
