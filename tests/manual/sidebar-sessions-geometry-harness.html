<body>
<div id="header-mount"></div>
<div id="launchpad-screen" class="screen active">
  <div class="launchpad-container"><h1>home</h1></div>
</div>
<div id="panel-mount"></div>

<script src="../../client/js/api.js"></script>
<script src="../../client/js/session-label.js"></script>
<script src="../../client/js/session-status-ui.js"></script>
<script src="../../client/js/session-row-actions.js"></script>

<script>
/**
 * The nine real session names, in the order the live database holds them.
 * Copied from a read-only `sqlite3 .backup` of the shipped cloude.db.
 * @type {Array<string>}
 */
const SAMPLE_NAMES = [
    'cloude_Test', 'cloude_asd', 'cloude_config-sync-tool-2',
    'cloude_console-msw4z3m5', 'cloude_fs2', 'cloude_fstest',
    'cloude_scrolltest', 'cloude_ses_2a5a4495', 'cloude_test pause',
];

/**
 * Description: build the attachable-probe fixture. Every row matches the
 *   live database (family NULL, source 'unknown', all running) except two
 *   deliberately promoted so the fact and guess pill states are also on
 *   screen and therefore also measurable.
 * Inputs: none.
 * Output: Array<object> - attachable rows.
 */
function fixtureRows() {
    const rows = SAMPLE_NAMES.map((name, i) => ({
        name,
        created_by_cloude: i % 3 !== 0,
        created_at_epoch: Math.floor(Date.now() / 1000) - (3600 * (i + 1)),
        window_count: 1,
        status: i === 5 ? 'idle' : 'working',
        unread: false,
        agent_family: i === 1 ? 'claude' : (i === 2 ? 'codex' : null),
        agent_family_source: i === 1 ? 'wrapper' : (i === 2 ? 'fingerprint' : 'unknown'),
        pinned_theme: null,
    }));
    rows[4].created_by_cloude = null;
    for (const r of rows) {
        if (labels[r.name] !== undefined) r.label = labels[r.name];
    }
    return rows;
}

let failNextListing = false;

/**
 * Labels the fake server holds, keyed by the tmux name that never moves.
 * The stub has to APPLY a rename it accepted, or the list re-renders the
 * old value and a working commit measures as a failure - the harness
 * would be reporting on itself rather than on the app.
 * @type {Object<string, string>}
 */
const labels = {};

window.__seedLabel = function (tmuxName, label) { labels[tmuxName] = label; };

/**
 * Description: flip the attachable probe into a structured 503, the shape
 *   the server really answers with when it cannot read tmux.
 * Inputs: on (boolean). Output: void.
 */
window.__setListingFails = function (on) { failNextListing = on; };

const groupState = { groups: [], members: new Map(), seq: 0, failNext: null };

window.__failNextGroupWrite = function (message) { groupState.failNext = message; };

/** Description: seed groups directly. Inputs: defs (Array). Output: void. */
window.__seedGroups = function (defs) {
    groupState.groups = [];
    groupState.members = new Map();
    groupState.seq = 0;
    for (const def of (defs || [])) {
        groupState.seq += 1;
        groupState.groups.push({
            group_uuid: def.uuid || `u${groupState.seq}`,
            name: def.name,
            position: groupState.groups.length,
        });
        for (const m of (def.members || [])) {
            groupState.members.set(m, def.uuid || `u${groupState.seq}`);
        }
    }
};

/** Description: the wire shape of the current group state. Output: object. */
function groupsBody() {
    return {
        status: 'ok',
        detail: null,
        groups: groupState.groups
            .slice()
            .sort((a, b) => (a.position - b.position)
                || (a.group_uuid < b.group_uuid ? -1 : 1))
            .map((g) => ({
                group_uuid: g.group_uuid,
                name: g.name,
                position: g.position,
                members: Array.from(groupState.members.entries())
                    .filter(([, uuid]) => uuid === g.group_uuid)
                    .map(([name]) => name)
                    .sort(),
            })),
    };
}

/** Description: throw when a failure was armed. Output: void. */
function maybeFail() {
    if (groupState.failNext === null) return;
    const message = groupState.failNext;
    groupState.failNext = null;
    const err = new Error(message);
    err.status = 503;
    throw err;
}

window.API = {
    async listSessionGroups() { return groupsBody(); },
    async createSessionGroup(name) {
        maybeFail();
        const clean = String(name).split(/\s+/).filter(Boolean).join(' ');
        if (!clean) { const e = new Error('group name is empty'); e.status = 400; throw e; }
        groupState.seq += 1;
        groupState.groups.push({
            group_uuid: `u${groupState.seq}`, name: clean,
            position: groupState.groups.length,
        });
        return groupsBody();
    },
    async renameSessionGroup(uuid, name) {
        maybeFail();
        const g = groupState.groups.find((x) => x.group_uuid === uuid);
        if (g) g.name = String(name).split(/\s+/).filter(Boolean).join(' ');
        return groupsBody();
    },
    async deleteSessionGroup(uuid) {
        maybeFail();
        let freed = 0;
        for (const [name, u] of Array.from(groupState.members.entries())) {
            if (u === uuid) { groupState.members.delete(name); freed += 1; }
        }
        groupState.groups = groupState.groups.filter((g) => g.group_uuid !== uuid);
        return Object.assign(groupsBody(), { freed });
    },
    async assignSessionGroup(tmuxName, uuid) {
        maybeFail();
        if (uuid === null || uuid === undefined) groupState.members.delete(tmuxName);
        else groupState.members.set(tmuxName, uuid);
        return groupsBody();
    },
    async reorderSessionGroups(uuids) {
        maybeFail();
        uuids.forEach((u, i) => {
            const g = groupState.groups.find((x) => x.group_uuid === u);
            if (g) g.position = i;
        });
        return groupsBody();
    },
    async listSessionRecords() {
        const now = Date.now();
        return SAMPLE_NAMES.slice(0, SAMPLE_NAMES.length - 1).map((name, i) => ({
            tmux_name: name,
            last_work_at: new Date(now - (60000 * (i + 1))).toISOString(),
        }));
    },
    async listAttachableSessions() {
        if (failNextListing) {
            const err = new Error('the server could not read the tmux session list');
            err.status = 503;
            err.detail = {
                listing_ok: false,
                listing_reason: 'tmux_missing',
                listing_detail: 'tmux is not installed on the server',
            };
            throw err;
        }
        return fixtureRows();
    },
    async listSessions() {
        if (failNextListing) return [];
        return [{
            tmux_session: 'cloude_fstest',
            label: labels.cloude_fstest,
            session: { id: 'sess-fstest-0001' },
            activity_status: 'idle',
            activity_hint: 'shell',
            unread: false,
            created_by_cloude: true,
            agent_family: null,
            agent_family_source: 'unknown',
            pinned_theme: null,
        }];
    },
    async renameSession(id, name) {
        if (window.__renameShouldFail) {
            const err = new Error('that name is already taken');
            err.status = 409;
            throw err;
        }
        labels.cloude_fstest = name;
        window.__lastRenameValue = name;
        window.__renameCallCount = (window.__renameCallCount || 0) + 1;
        return { session: { id, tmux_session: 'cloude_fstest' }, label: name };
    },
    async getSession() {
        return { session: { id: 'sess-fstest-0001' }, tmux_session: 'cloude_fstest' };
    },
    async adoptSession() { window.__switchCount += 1; return {}; },
    async setSessionUnread() { return {}; },
    async destroySession() { return {}; },
    async destroyExternalSession() { return {}; },
};
window.__switchCount = 0;
window.App = {
    returnToExistingTerminal() { window.__switchCount += 1; },
};
window.TerminalController = { async destroySession() {} };
</script>
<script src="../../client/js/session-listing-state.js"></script>
<script src="../../client/js/session-sidebar-group-membership.js"></script>
<script src="../../client/js/session-sidebar-group-store.js"></script>
<script src="../../client/js/session-sidebar-store.js"></script>
<script src="../../client/js/session-sidebar-arrangement.js"></script>
<script src="../../client/js/session-sidebar-fetch.js"></script>
<script src="../../client/js/session-sidebar-rename.js"></script>
<script src="../../client/js/session-sidebar-project-header.js"></script>
<script src="../../client/js/session-sidebar-groups.js"></script>
<script src="../../client/js/session-sidebar-clicks.js"></script>
<script src="../../client/js/session-sidebar.js"></script>
<script src="../../client/js/session-sidebar-pin.js"></script>
<script src="../../client/js/session-sidebar-density.js"></script>
<script src="../../client/js/session-sidebar-drop-target.js"></script>
<script src="../../client/js/session-sidebar-reorder.js"></script>
<script src="../../client/js/session-sidebar-group-actions.js"></script>
<script>
/**
 * Description: pull the real sidebar markup out of the shipped
 *   client/index.html rather than pasting a copy here, so a change to the
 *   panel cannot leave this harness measuring a page the app no longer
 *   serves.
 * Inputs: none.
 * Output: Promise<void>.
 */
async function mountRealMarkup() {
    const html = await (await fetch('../../client/index.html')).text();
    const doc = new DOMParser().parseFromString(html, 'text/html');
    const mount = document.getElementById('panel-mount');
    for (const sel of ['#session-sidebar-backdrop', '#session-sidebar-panel']) {
        const node = doc.querySelector(sel);
        if (node) mount.appendChild(document.importNode(node, true));
    }
    const header = doc.querySelector('.header');
    if (header) {
        document.getElementById('header-mount').appendChild(document.importNode(header, true));
    }
}

/**
 * Description: the geometry of every rendered row plus the list-level
 *   three-outcome attributes, all read from the live layout.
 * Inputs: none.
 * Output: object - the measurement payload the verifier asserts on.
 */
window.__sidebarMeasure = function () {
    const list = document.getElementById('session-sidebar-list');
    const panel = document.getElementById('session-sidebar-panel');
    const rows = Array.prototype.slice.call(list.querySelectorAll('.session-sidebar-row'));
    return {
        innerWidth: window.innerWidth,
        groupsState: list.getAttribute('data-groups-state'),
        bands: Array.prototype.slice.call(
            list.querySelectorAll('.session-sidebar-group[data-group]'),
        ).map((g) => {
            const box = g.getBoundingClientRect();
            const label = g.querySelector('.session-sidebar-group__label');
            return {
                key: g.getAttribute('data-group'),
                label: label ? label.textContent : '',
                count: g.getAttribute('data-count'),
                collapsed: g.getAttribute('data-collapsed'),
                top: box.top, bottom: box.bottom, height: box.height,
                left: box.left, right: box.right,
                hasMenu: !!g.querySelector('[data-group-menu]'),
                bodyRows: g.querySelectorAll('.session-sidebar-row').length,
            };
        }),
        rowBands: rows.map((r) => {
            const owner = r.closest('.session-sidebar-group[data-group]');
            return {
                name: r.dataset.name,
                band: owner ? owner.getAttribute('data-group') : null,
                pinned: r.getAttribute('data-pinned'),
            };
        }),
        density: panel.getAttribute('data-density'),
        listingOk: list.getAttribute('data-listing-ok'),
        arrangementState: list.getAttribute('data-arrangement-state'),
        orderMissing: list.getAttribute('data-order-missing'),
        attention: !!list.querySelector('.session-sidebar-attention'),
        attentionText: (list.querySelector('.session-sidebar-attention__title') || {}).textContent || '',
        notice: !!list.querySelector('.session-sidebar-notice'),
        noticeText: (list.querySelector('.session-sidebar-notice__detail') || {}).textContent || '',
        emptyState: !!list.querySelector('.session-sidebar-empty'),
        noteText: (list.querySelector('.session-sidebar-note') || {}).textContent || '',
        restartControls: list.querySelectorAll('[data-session-action="restart"]').length
            + (/restart/i.test(list.innerHTML) ? 1 : 0),
        live: (document.getElementById('session-sidebar-live') || {}).textContent || '',
        pills: Array.prototype.slice.call(list.querySelectorAll('.family-pill')).map((p) => ({
            cls: p.className,
            text: p.textContent,
            source: p.getAttribute('data-family-source'),
            box: p.getBoundingClientRect().height,
        })),
        rows: rows.map((r) => {
            const box = r.getBoundingClientRect();
            const nameEl = r.querySelector('.session-sidebar-row-name');
            return {
                name: r.dataset.name,
                displayName: nameEl ? nameEl.textContent : null,
                displayWidth: nameEl ? nameEl.getBoundingClientRect().width : 0,
                pinned: r.dataset.pinned,
                tabindex: r.getAttribute('tabindex'),
                height: box.height,
                top: box.top,
                bottom: box.bottom,
                pills: r.querySelectorAll('.family-pill').length,
                badges: r.querySelectorAll('.session-sidebar-row-badge').length,
                meta: r.querySelectorAll('.session-sidebar-row-meta').length,
                whens: r.querySelectorAll('.session-sidebar-row-when').length,
                hints: r.querySelectorAll('.session-sidebar-row-hint').length,
                grips: r.querySelectorAll('[data-grip-session]').length,
                pins: r.querySelectorAll('[data-pin-session]').length,
            };
        }),
        groups: Array.prototype.slice.call(
            list.querySelectorAll('.session-sidebar-group')
        ).map((gEl) => {
            const head = gEl.querySelector('.session-sidebar-group__header');
            const hb = head.getBoundingClientRect();
            return {
                key: gEl.getAttribute('data-group'),
                collapsed: gEl.getAttribute('data-collapsed'),
                declaredCount: Number(gEl.getAttribute('data-count')),
                renderedCount: gEl.querySelectorAll('.session-sidebar-row').length,
                badgeCount: Number(
                    (gEl.querySelector('.session-sidebar-group__count') || {}).textContent
                ),
                label: (gEl.querySelector('.session-sidebar-group__label') || {}).textContent,
                menus: gEl.querySelectorAll('.session-sidebar-group__menu').length,
                bandKind: (gEl.querySelector('.session-sidebar-group__headerrow') || {})
                    .dataset ? gEl.querySelector('.session-sidebar-group__headerrow')
                        .dataset.bandKind : null,
                expanded: head.getAttribute('aria-expanded'),
                controls: head.getAttribute('aria-controls'),
                bodyId: (gEl.querySelector('.session-sidebar-group__body') || {}).id,
                headerHeight: hb.height,
                headerTop: hb.top,
                chevronTransform: getComputedStyle(
                    gEl.querySelector('.session-sidebar-group__chevron')
                ).transform,
            };
        }),
        rename: (function () {
            const input = list.querySelector('.session-sidebar-rename-input');
            if (!input) return null;
            const box = input.getBoundingClientRect();
            const rowEl = input.closest('.session-sidebar-row');
            return {
                value: input.value,
                maxlength: input.getAttribute('maxlength'),
                width: box.width,
                height: box.height,
                rowHeight: rowEl ? rowEl.getBoundingClientRect().height : null,
                focused: document.activeElement === input,
                error: (list.querySelector('.session-sidebar-rename-error') || {}).textContent || '',
            };
        }()),
        renameStates: rows.map((r) => r.dataset.renameState),
        switchCount: window.__switchCount,
        focused: document.activeElement && document.activeElement.dataset
            ? (document.activeElement.dataset.name || null) : null,
        bodyPinned: document.body.classList.contains('session-sidebar-pinned'),
        screenPadLeft: getComputedStyle(document.querySelector('#launchpad-screen')).paddingLeft,
    };
};

/**
 * Description: focus one row by name so a real key event can be aimed at
 *   it. Returns false when no such row is rendered, rather than silently
 *   dispatching into nothing.
 * Inputs: name (string). Output: boolean.
 */
window.__focusRow = function (name) {
    const row = document.querySelector(`.session-sidebar-row[data-name="${CSS.escape(name)}"]`);
    if (!row) return false;
    row.focus();
    return document.activeElement === row;
};

/**
 * Description: re-run the whole load path from scratch, the way a page
 *   reload does - re-reading localStorage rather than reusing the
 *   in-memory arrangement, which is the only version of "survives a
 *   reload" worth asserting.
 * Inputs: none. Output: Promise<void>.
 */
window.__reload = async function () {
    window.SessionSidebarArrangement.load();
    window.SessionSidebarDensity.init();
    window.SessionSidebar._lastSig = null;
    await window.SessionSidebar._fetchAndRender();
};

(async function boot() {
    await mountRealMarkup();
    window.SessionSidebar.show();
    window.SessionSidebar.open();
    await window.SessionSidebar._fetchAndRender();
    window.__sidebarReady = true;
})();
</script>
