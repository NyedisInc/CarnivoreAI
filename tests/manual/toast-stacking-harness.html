<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>toast stacking harness</title>
<link rel="stylesheet" href="../../client/css/styles.css" />
<link rel="stylesheet" href="../../client/css/toast.css" />
<style>
  body { margin: 0; padding: 0; min-height: 100vh; }
</style>
</head>
<body>

<div class="toast-container" id="toast-container"></div>

<script src="../../client/js/session-status-summary.js"></script>
<script src="../../client/js/toast-session-group.js"></script>
<script src="../../client/js/toast.js"></script>

<script>
/**
 * Apply one shipped theme by writing its manifest's cssVars onto :root,
 * the same substitution the app performs at runtime.
 *
 * @param {string} id - a directory name under client/css/themes/.
 * @returns {Promise<object>} the manifest's cssVars.
 */
window.__setTheme = async function (id) {
    const res = await fetch('../../client/css/themes/' + id + '/theme.json');
    if (!res.ok) throw new Error('theme manifest ' + id + ' -> HTTP ' + res.status);
    const manifest = await res.json();
    const vars = manifest.cssVars || {};
    const root = document.documentElement;
    Object.keys(vars).forEach((k) => root.style.setProperty(k, vars[k]));
    root.setAttribute('data-theme', id);
    document.body.style.background = vars['--color-bg'] || '#000000';
    return vars;
};

/** Drop every toast without touching the (absent) server. @returns {void} */
window.__reset = function () {
    window.ToastManager.clearAll();
    // clearAll animates out over 220ms; strip the corpses so a following
    // measurement cannot read a dismissing card as a live one.
    const c = document.getElementById('toast-container');
    while (c.firstChild) c.removeChild(c.firstChild);
    window.ToastManager._byId.clear();
    window.ToastManager._expanded = false;
    window.__seq = 0;
};

window.__seq = 0;

/**
 * Feed the real module `n` synthetic server-shape toasts of one kind,
 * exactly the payload a toast.new frame carries.
 *
 * @param {number} n - how many.
 * @param {string} kind - Stop | Notification | PermissionRequest.
 * @param {boolean} [vary] - give each a distinct body, so a `Stop` burst
 *   is the real-world case (transcript tails differ) rather than a
 *   byte-identical one that would coalesce for an easier reason.
 * @param {boolean} [spread] - put each toast in a session of its own.
 *   THE CAP CANNOT BE MEASURED WITHOUT THIS. A session gets exactly one
 *   card now, so twelve toasts in one session are one card by
 *   definition; a stack tall enough to need a cap is a stack spanning
 *   several sessions, which is also the real-world shape - the screen
 *   that prompted this was two sessions, not one.
 * @returns {void}
 */
window.__burst = function (n, kind, vary, spread) {
    for (let i = 0; i < n; i++) {
        window.__seq += 1;
        window.ToastManager.add({
            id: 'probe-' + window.__seq,
            session_id: spread ? ('sess-probe-' + window.__seq) : 'sess-probe',
            kind: kind,
            title: kind === 'Stop' ? 'Your turn'
                 : kind === 'PermissionRequest' ? 'Permission needed'
                 : 'Claude is waiting',
            body: vary ? ('detail line ' + i) : 'a fixed body line',
            color: null,
            acknowledged: false,
        });
    }
};

/**
 * POSITIVE CONTROL: exactly one toast, nothing else. The driver asserts
 * it paints a real box before believing any "at most N cards" verdict.
 * @returns {void}
 */
window.__control = function () {
    window.__reset();
    window.__burst(1, 'Stop');
};

/** Click the overflow row, if one is rendered. @returns {boolean} */
window.__expand = function () {
    const row = document.querySelector('.toast-overflow');
    if (!row) return false;
    row.click();
    return true;
};

/**
 * Measure what is actually PAINTED: one bounding rect per rendered card,
 * plus the overflow row's box and the text it is showing.
 *
 * A card is counted only when its rect has non-zero width AND height and
 * its computed visibility/display/opacity would let a human see it -
 * "the element is in the DOM" is the assertion class this file exists to
 * replace.
 *
 * @returns {object} the whole measurement bundle.
 */
window.__measure = function () {
    const box = (el) => {
        const r = el.getBoundingClientRect();
        const cs = getComputedStyle(el);
        return {
            x: Math.round(r.x), y: Math.round(r.y),
            w: Math.round(r.width), h: Math.round(r.height),
            display: cs.display, visibility: cs.visibility,
            opacity: parseFloat(cs.opacity),
            painted: r.width > 0 && r.height > 0
                     && cs.display !== 'none' && cs.visibility !== 'hidden'
                     && parseFloat(cs.opacity) > 0.01,
        };
    };
    const cards = Array.from(document.querySelectorAll('.toast')).map((el) => {
        const badge = el.querySelector('.toast__count');
        return {
            kind: el.dataset.kind,
            severity: el.dataset.severity,
            role: el.getAttribute('role'),
            title: (el.querySelector('.toast__title-text') || {}).textContent || '',
            badgeText: badge ? badge.textContent : null,
            badgeBox: badge ? box(badge) : null,
            box: box(el),
        };
    });
    const row = document.querySelector('.toast-overflow');
    const container = document.getElementById('toast-container');
    return {
        hidden: document.hidden,
        visibilityState: document.visibilityState,
        innerWidth: window.innerWidth,
        innerHeight: window.innerHeight,
        narrowMatches: window.matchMedia('(max-width: 640px)').matches,
        ariaLive: container.getAttribute('aria-live'),
        containerBox: box(container),
        cards: cards,
        overflow: row ? {
            text: row.textContent,
            hiddenCount: row.dataset.hiddenCount,
            worstSeverity: row.dataset.worstSeverity,
            box: box(row),
        } : null,
    };
};

/**
 * Block until nothing is animating AND two consecutive frames agree.
 *
 * BOTH HALVES ARE LOAD BEARING, and the two-frame half alone was measured
 * failing here. Cards transition in and out over 200ms
 * (transform/opacity). getComputedStyle mid-transition returns the
 * ANIMATED value, not the end value, so a read landing inside a running
 * transition looks exactly like a rule that never applied. The usual
 * remedy - poll until two frames agree - is not sufficient at the START
 * of a transition: both frames can land at currentTime 0 and AGREE on the
 * pre-transition value. Measured directly: three identical runs of the
 * same twelve-toast burst returned opacity 0 / 0 / 1 with this function
 * reporting settled every time. So the animations are drained first
 * (Element.getAnimations, finish() rather than waiting out the wall
 * clock) and the frame agreement is the second gate, not the only one.
 *
 * @returns {Promise<boolean>} false when paint never settled.
 */
window.__settle = async function () {
    const running = () => Array.prototype.concat.apply([],
        Array.from(document.querySelectorAll('.toast, .toast-overflow'))
            .map((el) => el.getAnimations()))
        .filter((a) => a.playState === 'running');
    const snap = () => JSON.stringify(
        Array.from(document.querySelectorAll('.toast, .toast-overflow')).map((el) => {
            const r = el.getBoundingClientRect();
            const cs = getComputedStyle(el);
            return [Math.round(r.x), Math.round(r.y), Math.round(r.width),
                    Math.round(r.height), cs.opacity, cs.transform,
                    el.textContent].join('|');
        }));
    const frame = () => new Promise((r) => requestAnimationFrame(() => r()));
    let prev = snap();
    for (let i = 0; i < 120; i++) {
        await frame();
        const live = running();
        if (live.length) { live.forEach((a) => a.finish()); prev = snap(); continue; }
        const now = snap();
        if (now === prev) { await frame(); if (!running().length && snap() === now) return true; }
        prev = now;
    }
    return false;
};

(async function boot() {
    await window.__setTheme('claude');
    window.__toastReady = true;
})();
</script>
</body>
</html>
