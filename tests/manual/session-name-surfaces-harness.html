<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Cloude Code</title>
<link rel="stylesheet" href="../../client/css/styles.css" />
<link rel="stylesheet" href="../../client/css/toast.css" />
<style>
  body { margin: 0; padding: 0; min-height: 100vh; background: #1e1e1e; }
</style>
</head>
<body>

<!-- The SHIPPED container markup, id and all. -->
<div class="toast-container" id="toast-container"></div>

<script src="../../client/js/session-label.js"></script>
<script src="../../client/js/toast.js"></script>
<script src="../../client/js/app.js"></script>

<script>
/** Drop every toast without touching the (absent) server. @returns {void} */
window.__reset = function () {
    const c = document.getElementById('toast-container');
    window.ToastManager._byId.clear();
    window.ToastManager._expanded = false;
    while (c.firstChild) c.removeChild(c.firstChild);
    document.title = 'Cloude Code';
};

/**
 * Feed the real toast module one server-shape payload.
 *
 * @param {object} identity - { session_label, session_name } as the
 *   server stamps them at record time; either may be null.
 * @returns {void}
 */
window.__toast = function (identity) {
    window.ToastManager.add({
        id: 'probe-' + Math.random().toString(16).slice(2),
        session_id: 'sess-probe',
        kind: 'Stop',
        title: 'Your turn',
        body: 'a fixed body line',
        color: null,
        acknowledged: false,
        session_label: identity ? identity.session_label : null,
        session_name: identity ? identity.session_name : null,
    });
};

/**
 * Drive the REAL tab-title function with a session-shaped value.
 * @param {*} sessionLike - whatever a caller would hand setPageTitle.
 * @returns {string} document.title afterwards.
 */
window.__title = function (sessionLike) {
    window.setPageTitle(sessionLike);
    return document.title;
};

/**
 * POSITIVE CONTROL: prove the rig can move BOTH surfaces.
 *
 * A run where document.title was pinned, or where the toast module never
 * painted anything, would satisfy several "shows X" verdicts by
 * accident. This must show a changed title AND a painted card before any
 * real assertion is believed.
 * @returns {object} { titleMoved, cardPainted }
 */
window.__control = function () {
    window.__reset();
    const before = document.title;
    window.setPageTitle('a control string');
    const titleMoved = document.title !== before && document.title.indexOf('a control string') === 0;
    window.__toast({ session_label: 'control', session_name: 'cloude_control' });
    const card = document.querySelector('.toast');
    const r = card ? card.getBoundingClientRect() : null;
    return {
        titleMoved: titleMoved,
        cardPainted: !!(r && r.width > 0 && r.height > 0),
    };
};

/**
 * Measure one element as a box plus the colours actually painted on it.
 * @param {Element|null} el
 * @returns {object|null}
 */
function box(el) {
    if (!el) return null;
    const r = el.getBoundingClientRect();
    const cs = getComputedStyle(el);
    return {
        w: r.width, h: r.height,
        display: cs.display, visibility: cs.visibility,
        opacity: parseFloat(cs.opacity),
        color: cs.color, fontSize: cs.fontSize,
        painted: r.width > 0 && r.height > 0
                 && cs.display !== 'none' && cs.visibility !== 'hidden'
                 && parseFloat(cs.opacity) > 0.01,
    };
}

/**
 * The whole measurement bundle for the currently-rendered state.
 * @returns {object}
 */
window.__measure = function () {
    const card = document.querySelector('.toast');
    const sessionEl = card ? card.querySelector('.toast__session') : null;
    return {
        viewport: {
            innerWidth: window.innerWidth,
            innerHeight: window.innerHeight,
            hidden: document.hidden,
            visibilityState: document.visibilityState,
        },
        title: document.title,
        cardPresent: !!card,
        cardBox: box(card),
        sessionPresent: !!sessionEl,
        sessionText: sessionEl ? sessionEl.textContent : null,
        sessionBox: box(sessionEl),
        titleText: card
            ? (card.querySelector('.toast__title-text') || {}).textContent || null
            : null,
    };
};

window.__surfacesReady = true;
</script>
</body>
</html>
