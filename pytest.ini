[pytest]
norecursedirs =
    .git
    build
    macOS/dist
    hosted/catalog_index/tools/tests
    macOS/node_modules
    scripts/codemirror-vendor/node_modules
    node_modules
    venv
    .venv
    .worktrees
    .claude

markers =
    real_relay_start: calls the real relay_publisher.start_if_enabled with its own fakes. Without it the autouse fixture in tests/conftest.py answers None, because publishing is on by default and an app boot would otherwise reach the real Keychain and the live relay.
    full_tier: a browser pixel test the client tier of scripts/run_test_tier.py deselects; applied automatically by tests/conftest.py from tests/full_tier_files.txt, and still run by scripts/run-tests.sh.
    with_default_login: keeps the built-in default-login row (`poller_scan.with_auto_default`) in a poller test; every other test in tests/test_provider_ledger_poller.py reasons about configured rows alone and runs with the row switched off.
    real_transcripts: reads this machine's real Claude Code transcripts and Codex rollouts, read only (tests/transcript_contract/test_drift.py); skipped unless CARNIVORE_TRANSCRIPT_DRIFT=1, so the default suite never depends on what is on disk.
    real_ssh: runs against a REAL ssh host named by CARNIVORE_TEST_SSH_HOST (issue #162); skipped when it is unset, so the default suite never touches the network.
    real_tool_family_signals: reads the real Pack, messaging and ai tool-family signals (src/core/mcp/family_signals.py); without it the autouse fixture in tests/conftest.py reports every automatic family as in use (#1754).
    real_swarm_switch: reads the real global Swarm switch (config.json swarm_switch, src/core/swarm/switch.py); without it the autouse fixture in tests/conftest.py reads it as ON.
    real_agent_tool_switches: reads the real mcp.agent_huddle_tools / agent_swarm_tools / agent_app_settings_tools checkboxes (src/core/mcp/agent_tool_switches.py); without it the autouse fixture in tests/conftest.py offers every huddle, swarm and app-settings tool, since huddle and app-settings tools ship off (#1685, #1754).
    real_deprecated_default_off: reads the real DEFAULT_OFF (the deprecated MCP tools ship switched off, src/core/mcp/deprecated_tools.py); without it the autouse fixture in tests/conftest.py switches them on so tests of their behavior can call them (#1842).
    real_tmux: drives a real tmux server on this run's throwaway socket. Slower than the rest of the suite and the group most likely to flake under concurrent load, because the waits are real waits against a real process. Deselect with -m "not real_tmux" for a fast local loop; select with -m real_tmux to verify that group deliberately, and run it more than once, since one pass proves nothing about a flake.

tmp_path_retention_policy = failed

timeout = 900
timeout_method = thread

filterwarnings =
    ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning:pytest_asyncio.plugin
